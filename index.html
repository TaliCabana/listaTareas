<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Tali Cabana" />
    <meta name="description" content="Agregar tareas" />
    <title>Lista de Tareas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./CSS/style.css" />
  </head>
  <body>
    <main class="container py-5">
      <h1 class="text-center mb-4">📝 Lista de Tareas</h1>

      <form id="formTarea" class="row g-2 justify-content-center mb-4">
        <div class="col-12 col-md-6">
          <input
            type="text"
            id="inputTarea"
            class="form-control"
            placeholder="Escribí una tarea"
            required
          />
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btnTarea">
            Agregar tarea
          </button>
        </div>
      </form>
      <!-- Lista donde se agregan las tareas -->
      <ul id="listaTareas" class="list-group"></ul>

    </main>
    <footer class="text-center py-3 bg-dark-subtle">
      <p>&copy; Todos los derechos reservados</p>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script src="./JS/app.js"></script>
  </body>
</html>
